<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DawnNav 数据库管理</title>
  <style>
    :root { color-scheme:light; --blue:#2563eb; --green:#059669; --red:#dc2626; --line:#e2e8f0; --muted:#64748b; --bg:#f1f5f9; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:#172033; font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .toolbar { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:14px max(18px,calc((100vw - 1180px)/2)); background:rgba(255,255,255,.96); border-bottom:1px solid var(--line); box-shadow:0 2px 12px rgba(15,23,42,.06); backdrop-filter:blur(10px); }
    .toolbar h1 { margin:0 auto 0 0; font-size:19px; }
    .counter { padding:5px 9px; border-radius:999px; background:#e2e8f0; color:#334155; font-size:12px; }
    .token { width:190px; padding:8px 10px; border:1px solid var(--line); border-radius:7px; }
    .btn { padding:8px 12px; border:0; border-radius:7px; background:#475569; color:white; font-weight:650; }
    .btn:hover { filter:brightness(.94); }
    .btn-primary { background:var(--blue); }
    .btn-save { background:var(--green); }
    .btn-danger { background:var(--red); }
    .btn-small { padding:5px 8px; font-size:12px; }
    main { width:min(1180px,calc(100% - 28px)); margin:22px auto 80px; }
    .notice { margin-bottom:16px; padding:11px 14px; border:1px solid #bfdbfe; border-radius:9px; background:#eff6ff; color:#1e40af; }
    .category { margin:0 0 16px; border:1px solid var(--line); border-radius:12px; background:white; box-shadow:0 2px 8px rgba(15,23,42,.04); overflow:hidden; }
    .category summary { display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; background:#f8fafc; border-bottom:1px solid var(--line); }
    .category summary::-webkit-details-marker { display:none; }
    .category summary::before { content:"▸"; color:var(--muted); }
    .category[open] summary::before { content:"▾"; }
    .category-name { flex:1; font-weight:750; font-size:16px; }
    .category-body { padding:16px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .grid-3 { grid-template-columns:2fr 2fr 1fr; }
    label { display:grid; gap:4px; color:#475569; font-size:12px; }
    input,select,textarea { width:100%; padding:8px 9px; border:1px solid #cbd5e1; border-radius:7px; background:white; color:#172033; }
    textarea { min-height:64px; resize:vertical; }
    input:focus,select:focus,textarea:focus { outline:2px solid #bfdbfe; border-color:var(--blue); }
    .section { margin:14px 0; padding:13px; border-left:4px solid #93c5fd; border-radius:7px; background:#f8fafc; }
    .section-head,.actions { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .section-head strong { flex:1; }
    .link { position:relative; margin:9px 0; padding:12px; border:1px solid var(--line); border-radius:9px; background:white; }
    .link .grid { padding-right:76px; }
    .link-actions { position:absolute; top:12px; right:12px; display:flex; gap:5px; }
    .empty { padding:24px; text-align:center; color:var(--muted); border:1px dashed #cbd5e1; border-radius:9px; }
    .loading { padding:60px; text-align:center; color:var(--muted); }
    #toast { position:fixed; right:18px; bottom:18px; z-index:50; max-width:360px; padding:11px 14px; border-radius:9px; background:#172033; color:white; box-shadow:0 8px 28px rgba(15,23,42,.24); opacity:0; transform:translateY(12px); pointer-events:none; transition:.2s; }
    #toast.show { opacity:1; transform:none; }
    #toast.error { background:#991b1b; }
    @media (max-width:760px) { .toolbar h1 { width:100%; } .token { flex:1; } .grid,.grid-3 { grid-template-columns:1fr; } .link .grid { padding-right:0; padding-top:34px; } }
  </style>
</head>
<body>
  <header class="toolbar">
    <h1>DawnNav 数据库管理</h1>
    <span id="counter" class="counter">正在读取…</span>
    <input id="token" class="token" type="password" autocomplete="current-password" placeholder="管理令牌（本机可留空）" aria-label="管理令牌">
    <button class="btn" type="button" onclick="loadData()">重新加载</button>
    <button class="btn btn-primary" type="button" onclick="addCategory()">新增分类</button>
    <button class="btn btn-save" type="button" onclick="saveData()">保存到数据库</button>
  </header>
  <main>
    <div class="notice">这里的保存操作会立即更新 SQL 数据库。首页刷新后即可看到变化，不需要重新运行 Hugo。</div>
    <div id="app" class="loading">正在加载数据库…</div>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script>
    let data = [];
    const app = document.getElementById("app");
    const tokenInput = document.getElementById("token");
    tokenInput.value = sessionStorage.getItem("dawnnav-admin-token") || "";
    tokenInput.addEventListener("input", () => sessionStorage.setItem("dawnnav-admin-token", tokenInput.value));

    function h(value) { return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]); }
    function modeOf(category) { return Array.isArray(category.list) ? "list" : Array.isArray(category.friend) ? "friend" : "links"; }
    function linksOf(category, sectionIndex) { return sectionIndex !== null ? category.list[sectionIndex].links : modeOf(category) === "friend" ? category.friend : category.links; }
    function linkCountForCategory(category) { return category.list ? category.list.reduce((n, section) => n + (section.links || []).length, 0) : (category.links || category.friend || []).length; }
    function linkCount() { return data.reduce((total, category) => total + linkCountForCategory(category), 0); }
    function updateCounter() { document.getElementById("counter").textContent = `${data.length} 个分类 · ${linkCount()} 条链接`; }

    function linkEditor(link, categoryIndex, sectionIndex, linkIndex) {
      const args = `${categoryIndex},${sectionIndex === null ? "null" : sectionIndex},${linkIndex}`;
      return `<div class="link">
        <div class="link-actions"><button class="btn btn-small" type="button" onclick="moveLink(${args},-1)" title="上移">↑</button><button class="btn btn-small btn-danger" type="button" onclick="deleteLink(${args})">删除</button></div>
        <div class="grid">
          <label>中文标题<input value="${h(link.title)}" oninput="updateLink(${args},'title',this.value)"></label>
          <label>英文标题<input value="${h(link.title_en)}" oninput="updateLink(${args},'title_en',this.value)"></label>
          <label style="grid-column:1/-1">网址<input value="${h(link.url)}" oninput="updateLink(${args},'url',this.value)" placeholder="https://"></label>
          <label>中文描述<textarea oninput="updateLink(${args},'description',this.value)">${h(link.description)}</textarea></label>
          <label>英文描述<textarea oninput="updateLink(${args},'description_en',this.value)">${h(link.description_en)}</textarea></label>
          <label>Logo（可选）<input value="${h(link.logo)}" oninput="updateLink(${args},'logo',this.value)"></label>
          <label>二维码（可选）<input value="${h(link.qrcode)}" oninput="updateLink(${args},'qrcode',this.value)"></label>
        </div>
      </div>`;
    }

    function renderLinks(links, categoryIndex, sectionIndex) {
      return links.length ? links.map((link, linkIndex) => linkEditor(link, categoryIndex, sectionIndex, linkIndex)).join("") : `<div class="empty">暂无链接</div>`;
    }

    function renderCategory(category, categoryIndex) {
      const mode = modeOf(category);
      let content;
      if (mode === "list") {
        content = category.list.map((section, sectionIndex) => `<div class="section">
          <div class="section-head"><strong>子分类 ${sectionIndex + 1}</strong><button class="btn btn-small btn-danger" type="button" onclick="deleteSection(${categoryIndex},${sectionIndex})">删除子分类</button></div>
          <div class="grid"><label>中文名称<input value="${h(section.term)}" oninput="updateSection(${categoryIndex},${sectionIndex},'term',this.value)"></label><label>英文名称<input value="${h(section.term_en)}" oninput="updateSection(${categoryIndex},${sectionIndex},'term_en',this.value)"></label></div>
          ${renderLinks(section.links || [], categoryIndex, sectionIndex)}
          <button class="btn btn-small btn-primary" type="button" onclick="addLink(${categoryIndex},${sectionIndex})">新增链接</button>
        </div>`).join("") + `<button class="btn btn-primary" type="button" onclick="addSection(${categoryIndex})">新增子分类</button>`;
      } else {
        const links = mode === "friend" ? category.friend : category.links;
        content = renderLinks(links || [], categoryIndex, null) + `<button class="btn btn-primary" type="button" onclick="addLink(${categoryIndex},null)">新增链接</button>`;
      }
      const modeLabel = {links:"普通链接",list:"带子分类",friend:"友情链接"}[mode];
      return `<details class="category" ${categoryIndex === 0 ? "open" : ""}>
        <summary><span class="category-name">${h(category.taxonomy || "未命名分类")}</span><span>${modeLabel}</span></summary>
        <div class="category-body">
          <div class="grid grid-3"><label>中文分类名<input value="${h(category.taxonomy)}" oninput="updateCategory(${categoryIndex},'taxonomy',this.value)"></label><label>英文分类名<input value="${h(category.taxonomy_en)}" oninput="updateCategory(${categoryIndex},'taxonomy_en',this.value)"></label><label>图标<input value="${h(category.icon)}" oninput="updateCategory(${categoryIndex},'icon',this.value)" placeholder="fa-star"></label></div>
          <div class="actions" style="margin-top:10px"><label style="display:flex;align-items:center;gap:7px">结构<select onchange="changeMode(${categoryIndex},this.value)"><option value="links" ${mode === "links" ? "selected" : ""}>普通链接</option><option value="list" ${mode === "list" ? "selected" : ""}>带子分类</option><option value="friend" ${mode === "friend" ? "selected" : ""}>友情链接</option></select></label><button class="btn btn-small" type="button" onclick="moveCategory(${categoryIndex},-1)">分类上移</button><button class="btn btn-small btn-danger" type="button" onclick="deleteCategory(${categoryIndex})">删除分类</button></div>
          ${content}
        </div>
      </details>`;
    }

    function render() { updateCounter(); app.className = ""; app.innerHTML = data.length ? data.map(renderCategory).join("") : `<div class="empty">数据库中还没有分类</div>`; }
    function updateCategory(index, key, value) { data[index][key] = value; updateCounter(); }
    function updateSection(categoryIndex, sectionIndex, key, value) { data[categoryIndex].list[sectionIndex][key] = value; }
    function updateLink(categoryIndex, sectionIndex, linkIndex, key, value) { linksOf(data[categoryIndex], sectionIndex)[linkIndex][key] = value; }
    function addCategory() { data.unshift({ taxonomy:"新分类", taxonomy_en:"New Category", icon:"fa-star", links:[] }); render(); }
    function deleteCategory(index) { if (confirm("确定删除这个分类及其全部链接吗？")) { data.splice(index, 1); render(); } }
    function moveCategory(index, direction) { const target=index+direction; if (target<0||target>=data.length) return; [data[index],data[target]]=[data[target],data[index]]; render(); }
    function changeMode(index, mode) { const category=data[index]; if (linkCountForCategory(category)&&!confirm("切换结构会清空这个分类当前的链接，是否继续？")) { render(); return; } delete category.links; delete category.list; delete category.friend; category[mode]=[]; render(); }
    function addSection(categoryIndex) { data[categoryIndex].list.push({ term:"新子分类", term_en:"New Section", links:[] }); render(); }
    function deleteSection(categoryIndex, sectionIndex) { if (confirm("确定删除这个子分类及其全部链接吗？")) { data[categoryIndex].list.splice(sectionIndex,1); render(); } }
    function addLink(categoryIndex, sectionIndex) { linksOf(data[categoryIndex],sectionIndex).push({ title:"",title_en:"",url:"",description:"",description_en:"" }); render(); }
    function deleteLink(categoryIndex, sectionIndex, linkIndex) { if (confirm("确定删除这条链接吗？")) { linksOf(data[categoryIndex],sectionIndex).splice(linkIndex,1); render(); } }
    function moveLink(categoryIndex, sectionIndex, linkIndex, direction) { const links=linksOf(data[categoryIndex],sectionIndex); const target=linkIndex+direction; if(target<0||target>=links.length)return; [links[linkIndex],links[target]]=[links[target],links[linkIndex]]; render(); }

    function showToast(message, error=false) { const toast=document.getElementById("toast"); toast.textContent=message; toast.className=error?"show error":"show"; clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.className="",3200); }
    async function loadData() { app.className="loading"; app.textContent="正在加载数据库…"; try { const response=await fetch("/api/data",{cache:"no-store"}); const body=await response.json(); if(!response.ok)throw new Error(body.error||"读取失败"); data=body; render(); } catch(error) { app.textContent=`读取失败：${error.message}`; showToast(error.message,true); } }
    async function saveData() { try { const headers={"Content-Type":"application/json"}; if(tokenInput.value)headers["X-Admin-Token"]=tokenInput.value; const response=await fetch("/api/save",{method:"POST",headers,body:JSON.stringify({data})}); const body=await response.json(); if(!response.ok)throw new Error(body.error||"保存失败"); showToast(`已保存 ${body.categories} 个分类、${body.count} 条链接`); updateCounter(); } catch(error) { showToast(error.message,true); } }
    loadData();
  </script>
</body>
</html>
