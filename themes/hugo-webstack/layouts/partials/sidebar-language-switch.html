<div class="sidebar-language-switch" data-sidebar-language-switch role="group" aria-label="语言 / Language">
    <i class="fa fa-globe language-switch-icon" aria-hidden="true"></i>
    <div class="language-switch-options">
        <button type="button" class="language-switch-option is-active" data-language="zh" aria-pressed="true" title="切换为中文">
            <span class="language-name-full">中文</span>
            <span class="language-name-short">中</span>
        </button>
        <button type="button" class="language-switch-option" data-language="en" aria-pressed="false" title="Switch to English">EN</button>
    </div>
</div>
